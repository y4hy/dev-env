# ================================================
# TEMEL AYARLAR
# ================================================

# Terminalin 256 renk desteğini kullanmasını sağla.
# Bu, temaların ve renklerin doğru görüntülenmesi için önemlidir.
set -g default-terminal "screen-256color"

# Komut geçmişinin (history) limitini artır.
set -g history-limit 10000

# Pencereleri ve panelleri 1'den başlayarak numaralandır. (Varsayılan 0'dır)
# NOT: Bu ayarın mevcut oturumlarda geçerli olması için tmux sunucusunu
# yeniden başlatmanız (`tmux kill-server` komutu) gerekebilir.
set -g base-index 1
setw -g pane-base-index 1

# Pencereler kapatıldığında numaraları otomatik olarak yeniden düzenle.
# Örneğin 1, 2, 4, 5 varken 2'yi kapatınca 4->3, 5->4 olur.
set -g renumber-windows on

# Mouse desteğini etkinleştir. Paneller arasında tıklayarak geçiş yapabilir,
# panel sınırlarını sürükleyerek boyutlandırabilirsin.
set -g mouse on

# Pencere boyutunu en küçük bağlı istemcinin boyutuna göre ayarla.
# Bu, farklı boyutlardaki monitörlerde çalışırken tutarlılık sağlar.
setw -g aggressive-resize on


# ================================================
# OTURUM YÖNETİMİ
# ================================================

# Bir oturum kapatıldığında istemciyi (client) ayırmak yerine
# bir önceki oturuma otomatik olarak geçiş yap.
set -g detach-on-destroy off

# Hiç oturum kalmadığında bile (son oturum kapatıldığında) tmux sunucusunu
# açık tut. Bu, "ana" oturumun yanlışlıkla kapatılmasını önler.
set -g exit-empty off


# ================================================
# EKLENTİ YÖNETİCİSİ (TPM) ve OTURUM KAYDETME
# ================================================
# NOT: Bu eklentileri kurmak için tmux'ı başlattıktan sonra
# `prefix + I` (Büyük i harfi) tuşlarına basın.

# Eklentilerin listesi
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect' # Oturumları kaydetme/geri yükleme (prefix + Ctrl-s / prefix + Ctrl-r)
set -g @plugin 'tmux-plugins/tmux-continuum' # Oturumları otomatik kaydetme ve tmux başlangıcında geri yükleme

set -g @resurrect-save-fish-history 'on'    # Fish geçmişini

# Tmux başladığında son kaydedilen oturumu otomatik olarak geri yükle.
set -g @continuum-restore 'on'

# Oturumun ne sıklıkla kaydedileceğini belirler (dakika cinsinden).
set -g @continuum-save-interval '10' # 10 dakikada bir otomatik kaydet

# ================================================
# KISAYOLLAR (KEYBINDINGS)
# ================================================

# Varsayılan prefix olan `Ctrl-b`'yi kaldır.
unbind C-b

# Yeni prefix'i `\` olarak ayarla.
# DİKKAT: Bu, normalde `\` tuşunu kullandığınızda gecikmeye neden olabilir.
set -g prefix '\'
bind-key '\' send-prefix

# ----- Panel Yönetimi -----

# Panelleri dikey olarak bölmek için (`=`), mevcut dizinde aç.
unbind %
unbind |
bind = split-window -h -c "#{pane_current_path}"

# Panelleri yatay olarak bölmek için (`-`), mevcut dizinde aç.
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Panel boyutlandırma kısayolları (prefix ile birlikte -r tekrar edilebilir demektir)
# Bu sayede prefix'e bastıktan sonra tuşlara art arda basarak
# paneli hızlıca boyutlandırabilirsin.
bind -r j resize-pane -D 5 # Alt paneli büyüt
bind -r k resize-pane -U 5 # Üst paneli büyüt
bind -r l resize-pane -R 5 # Sağ paneli büyüt
bind -r h resize-pane -L 5 # Sol paneli büyüt

# Aktif paneli tam ekran yap/eski boyutuna geri getir (zoom). `prefix m`
bind -r m resize-pane -Z

# ----- Kopyalama Modu (Vi stili) -----

# Kopyalama modu için Vi tuşlarını etkinleştir (hjkl, v, y, vb.).
set-window-option -g mode-keys vi

# `prefix v` ile kopyalama moduna (visual mode) gir. (YENİ)
bind v copy-mode

# Kopyalama modundayken `v` ile seçimi başlat.
bind-key -T copy-mode-vi 'v' send -X begin-selection
# Kopyalama modundayken `y` ile seçimi kopyala ve moddan otomatik olarak çık. (GÜNCELLENDİ)
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Mouse ile seçim yapıldığında kopyalama modundan otomatik çık.
unbind -T copy-mode-vi MouseDragEnd1Pane


# ----- Diğer Kısayollar -----

# `prefix r` ile tmux konfigürasyonunu yeniden yükle ve mesaj göster.
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# `prefix S` ile isim sorarak yeni bir oturum oluştur.
bind S command-prompt -p "New session:" "new-session -s '%%'"

# `prefix c` ile mevcut dizinde yeni bir pencere oluştur. (Varsayılan 'c' davranışı değiştirildi)
bind q new-window -c "#{pane_current_path}"

# `prefix x` ile paneli sormadan kapat.
unbind x
bind c kill-pane

# `prefix Tab` ile bir önceki aktif pencereye geçiş yap.
bind-key Tab last-window

# `prefix p` ile sağda küçük bir dikey panelde 'opencode' komutunu çalıştır.
bind p split-window -h -c "#{pane_current_path}" -l 35% "opencode"

# Başka bir penceredeki seçili paneli mevcut pencereye çek.
# `prefix _` (Shift--): Paneli dikey olarak birleştir.
bind-key _ choose-window 'join-pane -v -s "%%"'
# `prefix +` (Shift-=): Paneli yatay olarak birleştir.
bind-key + choose-window 'join-pane -h -s "%%"'


# ================================================
# GÖRÜNÜM & RENKLER
# ================================================

# Paneller
set -g pane-border-style 'fg=#666666'      # Pasif panel sınırı (koyu-gri)
set -g pane-active-border-style 'fg=#b0b0b0'  # Aktif panel sınırı (soluk beyaz)

# Durum Çubuğu
set -g status-style 'bg=default fg=#888888' # Arkaplan saydam, varsayılan metin soluk gri

# Pencere Listesi
setw -g window-status-current-style 'fg=#b0b0b0 bg=default,bold' # Aktif pencere (soluk beyaz, saydam)
setw -g window-status-style 'fg=#888888 bg=default'   # Pasif pencereler (soluk gri, saydam)

# Mesajlar (Komut satırı vb.)
set -g message-style 'fg=#b0b0b0 bg=default,bold' # Mesajlar (soluk beyaz, saydam)


# ================================================
# VIM & TMUX ENTEGRASYONU (VIM-TMUX-NAVIGATOR)
# ================================================
# Bu bölüm, Vim/Neovim içindeyken Ctrl + h/j/k/l tuşlarını kullanarak
# Vim panelleri (splits) ve Tmux panelleri arasında sorunsuzca geçiş yapmanı sağlar.

vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\' 'select-pane -l'"

# Kopyalama modunda da panel geçişlerini etkinleştir.
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l


# TPM'yi başlat (bu satır her zaman en altta olmalı)
run '~/.tmux/plugins/tpm/tpm'
